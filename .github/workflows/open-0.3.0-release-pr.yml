name: Open 0.3.0 release PR

on:
  push:
    branches: ["release/0.3.0"]
    paths:
      - ".github/workflows/open-0.3.0-release-pr.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.3.0
          persist-credentials: false

      - name: Open bot-authored release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo parthdongre/FrameVitals \
            --base main \
            --head release/0.3.0 \
            --title "release: FrameVitals 0.3.0" \
            --body "Final FrameVitals 0.3.0 release candidate. Versions are synchronized across Python and Rust, Cargo.lock is regenerated, the changelog is finalized, CodeQL reports no new alerts, and the release candidate passed the core/native/interoperability/frontend/package-quality gates. This PR is automation-authored so the repository owner's approval can satisfy the protected-main review rule without bypassing branch protection. develop/august remains a long-lived branch."
