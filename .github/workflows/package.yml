name: Package

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))

          assert len(wheels) == 1, (
              f"Expected exactly one wheel, found {len(wheels)}"
          )

          wheel = wheels[0]

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()

          assert any(
              name.startswith("framevitals/")
              for name in names
          ), "framevitals package missing from wheel"

          assert not any(
              name.startswith("modules/")
              for name in names
          ), "legacy modules package leaked into wheel"

          print(
              f"Verified distribution boundary: {wheel.name}"
          )
          PY

      - name: Validate distributions
        run: |
          python -m twine check dist/*
