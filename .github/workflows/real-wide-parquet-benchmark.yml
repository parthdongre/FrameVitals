name: Real Wide Parquet Benchmark

on:
  push:
    branches: ["develop/august"]
    paths:
      - "benchmarks/benchmark_real_wide_parquet.py"
      - ".github/workflows/real-wide-parquet-benchmark.yml"
      - "src/framevitals/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Full pipeline 100k x 10k real Parquet
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[arrow]"

      - name: Generate real 100k x 10k Parquet dataset
        run: |
          python benchmarks/benchmark_real_wide_parquet.py \
            --generate-only \
            --dataset wide-100k-x-10k.parquet \
            --rows 100000 \
            --columns 10000 \
            --row-group-rows 10000 \
            --output generation.json

      - name: Run all four full analysis modes
        env:
          FRAMEVITALS_BACKEND: numpy
        run: |
          for mode in quick standard deep research; do
            echo "=== ${mode} ==="
            python benchmarks/benchmark_real_wide_parquet.py \
              --dataset wide-100k-x-10k.parquet \
              --mode "${mode}" \
              --output "real-wide-${mode}.json"
          done

      - name: Validate full-pipeline accuracy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for mode in ("quick", "standard", "deep", "research"):
              payload = json.loads(Path(f"real-wide-{mode}.json").read_text())
              accuracy = payload["accuracy"]
              checked = accuracy["profiled_columns_checked"]
              if accuracy["missing_count_exact_matches"] != checked:
                  failures.append(f"{mode}: missing-count parity failed")
              if accuracy["numeric_count_exact_matches"] != checked:
                  failures.append(f"{mode}: numeric-count parity failed")
              if accuracy["numeric_minmax_exact_matches"] != checked:
                  failures.append(f"{mode}: min/max parity failed")
              if (accuracy["profile_mean_max_abs_error"] or 0.0) > 0.01:
                  failures.append(
                      f"{mode}: profile mean max error {accuracy['profile_mean_max_abs_error']}"
                  )
              if accuracy["health_missing_abs_error"] > 0.02:
                  failures.append(
                      f"{mode}: health missingness error {accuracy['health_missing_abs_error']}"
                  )
              if (accuracy["deep_mean_max_abs_error"] or 0.0) > 8.0:
                  failures.append(
                      f"{mode}: bounded deep-stat mean error {accuracy['deep_mean_max_abs_error']}"
                  )
              if payload["safety"]["full_materialization"] is not False:
                  failures.append(f"{mode}: full materialization occurred")

          if failures:
              raise SystemExit("\n".join(failures))
          print("All full-pipeline accuracy checks passed.")
          PY

      - name: Publish benchmark summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          generation_path = Path("generation.json")
          if generation_path.exists():
              generation = json.loads(generation_path.read_text())
              print("## Real 100k x 10k Parquet dataset")
              print()
              print(f"- Logical cells: **{generation['cells']:,}**")
              print(f"- Dense int16 equivalent: **{generation['dense_int16_raw_gb']:.2f} GB**")
              print(f"- Parquet file size: **{generation['file_size_mb']:.2f} MB**")
              print(f"- Generation time: **{generation['generation_seconds']:.3f}s**")
              print(f"- Row groups: **{generation['row_groups']}**")
              print()

          print("## Full analysis results")
          print()
          print("| Mode | Wall time | Profiled cols | Sample rows | Profile mean max error | Deep mean max error | Health missing error |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for mode in ("quick", "standard", "deep", "research"):
              path = Path(f"real-wide-{mode}.json")
              if not path.exists():
                  print(f"| {mode.title()} | failed | - | - | - | - | - |")
                  continue
              payload = json.loads(path.read_text())
              safety = payload["safety"]
              accuracy = payload["accuracy"]
              print(
                  f"| {mode.title()} | {payload['analysis_seconds']:.3f}s | "
                  f"{safety['profiled_columns']} | {safety['working_sample_rows']} | "
                  f"{accuracy['profile_mean_max_abs_error']} | "
                  f"{accuracy['deep_mean_max_abs_error']} | "
                  f"{accuracy['health_missing_abs_error']} |"
              )
              print()
              print(f"### {mode.title()} pipeline stages")
              for name, milliseconds in sorted(payload.get("pipeline_timings_ms", {}).items()):
                  if isinstance(milliseconds, (int, float)):
                      print(f"- {name}: {milliseconds / 1000:.3f}s")
              print()
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: framevitals-real-wide-100k-x-10k
          path: |
            generation.json
            real-wide-quick.json
            real-wide-standard.json
            real-wide-deep.json
            real-wide-research.json
          if-no-files-found: ignore
          retention-days: 30
