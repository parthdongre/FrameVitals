name: Sync 0.3.0 Cargo lockfile

on:
  push:
    branches: ["release/0.3.0"]
    paths:
      - "rust/framevitals-py/Cargo.toml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.3.0

      - name: Refresh workspace lockfile from release manifests
        run: cargo check --manifest-path rust/Cargo.toml --workspace

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- rust/Cargo.lock; then
            echo "Cargo.lock already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          git commit -m "chore: sync Cargo.lock for 0.3.0"
          git push origin HEAD:release/0.3.0
