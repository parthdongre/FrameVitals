name: Publish FrameVitals to PyPI

on:
  release:
    types: [published]
  push:
    branches: ["release/0.3.0"]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  publish-linux-abi3-correction:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'release: add corrected Linux ABI3 wheel to 0.3.0' }}"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/framevitals/0.3.0/
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout exact released source
        uses: actions/checkout@v6
        with:
          ref: 3f73877d41c3ab30b8c73747bff36841e0bbcab2
          persist-credentials: false

      - name: Set up Python 3.12 for validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build corrected Linux ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          target: x86_64-unknown-linux-gnu
          manylinux: "2_28"
          args: >-
            --locked
            --release
            --manifest-path rust/framevitals-py/Cargo.toml
            --interpreter python3.11
            --out dist
            --compatibility pypi

      - name: Verify corrected artifact
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          expected = "framevitals-0.3.0-cp311-abi3-manylinux_2_28_x86_64.whl"
          assert wheel.name == expected, f"Expected {expected}, got {wheel.name}"
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "framevitals/py.typed" in names
          assert any(name.startswith("framevitals/_native") and name.endswith(".so") for name in names)
          print("Publishing corrected artifact:", wheel.name)
          PY

      - name: Publish corrected Linux ABI3 wheel
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
