name: Publish FrameVitals to PyPI

on:
  release:
    types: [published]
  push:
    branches: ["release/0.3.0"]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build-fallback:
    name: Build portable fallback
    if: "${{ github.event_name == 'release' || github.event.head_commit.message == 'release: publish FrameVitals 0.3.0' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && '3f73877d41c3ab30b8c73747bff36841e0bbcab2' || github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify release version across Python and Rust packages
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && 'v0.3.0' || github.event.release.tag_name }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          import framevitals

          tag = os.environ["RELEASE_TAG"]
          release_version = tag[1:] if tag.startswith("v") else tag
          with Path("pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          with Path("rust/framevitals-core/Cargo.toml").open("rb") as handle:
              core_version = tomllib.load(handle)["package"]["version"]
          with Path("rust/framevitals-py/Cargo.toml").open("rb") as handle:
              bridge_version = tomllib.load(handle)["package"]["version"]
          package_version = framevitals.__version__
          assert Path("rust/Cargo.lock").is_file(), "Rust workspace lockfile is missing"

          versions = {
              "release tag": release_version,
              "pyproject": project_version,
              "python package": package_version,
              "rust core": core_version,
              "rust bridge": bridge_version,
          }
          assert len(set(versions.values())) == 1, f"Release versions disagree: {versions}"
          print(f"Release version verified across Python/Rust packages: {project_version}")
          PY

      - name: Build portable fallback wheel and sdist
        run: python -m build --outdir dist

      - name: Validate fallback distributions
        run: python -m twine check dist/*

      - name: Store fallback distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-fallback
          path: dist/
          if-no-files-found: error

  build-native:
    name: Native wheel — ${{ matrix.name }}
    if: "${{ github.event_name == 'release' || github.event.head_commit.message == 'release: publish FrameVitals 0.3.0' }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && '3f73877d41c3ab30b8c73747bff36841e0bbcab2' || github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python 3.11 ABI floor
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build native abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --locked
            --release
            --manifest-path rust/framevitals-py/Cargo.toml
            --interpreter python
            --out dist
            --compatibility pypi

      - name: Verify native wheel payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one native wheel, found {len(wheels)}"
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          suffixes = (".so", ".pyd", ".dylib")
          assert "framevitals/py.typed" in names, f"PEP 561 marker missing from {wheel.name}"
          assert any(
              name.startswith("framevitals/_native") and name.endswith(suffixes)
              for name in names
          ), f"Native extension missing from {wheel.name}"
          print(f"Verified native distribution: {wheel.name}")
          PY

      - name: Store native wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-package-native-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  stage-github-release:
    name: Stage GitHub release
    if: "${{ github.event_name == 'release' || github.event.head_commit.message == 'release: publish FrameVitals 0.3.0' }}"
    needs: [build-fallback, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create v0.3.0 draft release when manually publishing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.0 release already exists."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          # FrameVitals v0.3.0

          FrameVitals 0.3.0 makes execution planning and resource control first-class, hardens monitoring and web paths, and preserves the source-aware Arrow/Rust architecture introduced in 0.2.0.

          ## Highlights

          - Enforceable per-run resource caps for sampled rows, relationship work, memory-heavy parallelism, and ultra-wide streaming profiling.
          - Deterministic configuration precedence across presets, environment variables, TOML/config mappings, and explicit Python/CLI arguments.
          - A versioned dependency-aware execution planner with structured module decisions, topological stages, and centralized mode policy.
          - Reusable per-run `AnalysisContext` state for exactly-once planning intermediates, facts, bounded samples, and metadata-only provenance.
          - Correct hard-cap enforcement for low sample budgets.
          - Snapshot integrity validation and monitoring fixes.
          - Flask/web filesystem, exception-disclosure, and sensitive-path logging hardening.
          - Compatibility retained for the 0.2 source-aware Arrow/Rust execution model and existing public result contracts.

          ## Install

          ```bash
          pip install framevitals==0.3.0
          ```

          FrameVitals 0.3.0 supports Python 3.11, 3.12, and 3.13. Native ABI3 wheels are published for Linux x86_64, macOS arm64, macOS x86_64, and Windows x86_64, alongside a portable fallback wheel and source distribution.

          See `CHANGELOG.md` for the complete release notes.
          EOF
          gh release create v0.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target 3f73877d41c3ab30b8c73747bff36841e0bbcab2 \
            --title "FrameVitals v0.3.0" \
            --notes-file release-notes.md \
            --draft

  publish:
    name: Publish distributions to PyPI
    if: "${{ github.event_name == 'release' || github.event.head_commit.message == 'release: publish FrameVitals 0.3.0' }}"
    needs: [build-fallback, build-native, stage-github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/framevitals
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download all release distributions
        uses: actions/download-artifact@v6
        with:
          pattern: python-package-*
          path: dist/
          merge-multiple: true

      - name: Show release payload
        run: ls -lh dist/

      - name: Validate complete release payload
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          native = [path for path in wheels if "none-any" not in path.name]
          fallback = [path for path in wheels if "none-any" in path.name]

          assert len(sdists) == 1, f"Expected one sdist, found {len(sdists)}"
          assert len(fallback) == 1, f"Expected one portable fallback wheel, found {len(fallback)}"
          assert len(native) == 4, f"Expected four native wheels, found {len(native)}: {native}"
          print("Release payload contains one fallback wheel, one sdist, and four native wheels.")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    name: Publish GitHub release
    if: "${{ github.event_name == 'release' || github.event.head_commit.message == 'release: publish FrameVitals 0.3.0' }}"
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish staged v0.3.0 release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.3.0 --repo "$GITHUB_REPOSITORY" --draft=false
