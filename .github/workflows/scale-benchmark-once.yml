name: One-off Largest Scale Benchmark

on:
  push:
    branches: [develop/august]
    paths:
      - .github/workflows/scale-benchmark-once.yml

permissions:
  contents: read

jobs:
  largest-profile-scale:
    name: 100k x 105 profile stress test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[arrow]"
          python -m pip check

      - name: Run largest built-in scale workload
        run: |
          python benchmarks/benchmark_profile_scale.py \
            --rows 100000 \
            --numeric-columns 100 \
            --categorical-columns 5 \
            --scenarios numpy auto parquet \
            --output largest-benchmark-results.json

      - name: Print benchmark findings
        run: cat largest-benchmark-results.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v5
        with:
          name: framevitals-largest-benchmark
          path: largest-benchmark-results.json
          retention-days: 7
