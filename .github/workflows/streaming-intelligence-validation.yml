name: Streaming Intelligence Validation

on:
  push:
    branches: ["feature/streaming-intelligence"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FrameVitals
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,arrow]"
      - name: Focused regression tests
        run: |
          pytest -q \
            tests/test_deep_triage.py \
            tests/test_neural_anomaly.py \
            tests/test_streaming_sketches.py \
            tests/test_arrow_memory.py \
            tests/test_adaptive_execution.py \
            tests/test_analysis_modes.py
      - name: Benchmark deep mode on complex 8k x 180 data
        run: |
          python - <<'PY'
          import json
          import time
          import numpy as np
          import pandas as pd
          import framevitals

          rows = 8000
          rng = np.random.default_rng(20260817)
          data = {}
          base = rng.normal(size=rows)
          for i in range(60):
              values = 0.75 * base + 0.25 * rng.normal(size=rows) if i < 8 else rng.normal(size=rows)
              if i % 9 == 0:
                  values = values.copy()
                  values[::23] = np.nan
              if i % 13 == 0:
                  values = values.copy()
                  values[::401] *= 20
              data[f"num_{i}"] = values
          for i in range(20):
              values = rng.normal(size=rows)
              values[rng.random(rows) < 0.92] = np.nan
              data[f"sparse_{i}"] = values
          for i in range(30):
              data[f"cat_{i}"] = np.array([f"g{j % (3 + i % 12)}" for j in range(rows)], dtype=object)
          for i in range(18):
              data[f"flag_{i}"] = (np.arange(rows) + i) % 2 == 0
          base_time = np.datetime64("2024-01-01")
          for i in range(8):
              data[f"time_{i}"] = base_time + np.arange(rows).astype("timedelta64[h]") + np.timedelta64(i, "D")
          text = np.array([f"customer event note segment {j % 20} with descriptive text" for j in range(rows)], dtype=object)
          for i in range(8):
              data[f"text_{i}"] = text
          data["email"] = np.array([f"user{j}@example.com" for j in range(rows)], dtype=object)
          data["phone"] = np.array([f"+91{9000000000 + j}" for j in range(rows)], dtype=object)
          data["customer_id"] = np.arange(rows, dtype=np.int64)
          data["account_id"] = np.arange(rows, dtype=np.int64) + 100000
          data["constant"] = np.ones(rows)
          data["near_constant"] = np.where(np.arange(rows) % 997 == 0, 1, 0)
          logits = np.nan_to_num(data["num_0"], nan=0.0) + 0.65 * np.nan_to_num(data["num_1"], nan=0.0) + rng.normal(scale=0.8, size=rows)
          data["target"] = (logits > np.median(logits)).astype(int)
          index = 0
          while len(data) < 180:
              data[f"extra_{index}"] = np.array([f"x{j % 7}" for j in range(rows)], dtype=object)
              index += 1
          df = pd.DataFrame(data)

          started = time.perf_counter()
          result = framevitals.analyze(df, mode="deep", target="target", artifacts=False, workers=1)
          elapsed = time.perf_counter() - started
          payload = {
              "elapsed_seconds": round(elapsed, 3),
              "rows": len(df),
              "columns": len(df.columns),
              "deep_statistics_execution": result.get("deep_statistics_v2", {}).get("execution", {}),
              "triage": result.get("deep_statistics_v2", {}).get("column_triage", {}),
              "module_status": result.get("execution", {}).get("module_status", {}),
          }
          print("FRAMEVITALS_DEEP_BENCHMARK=" + json.dumps(payload, sort_keys=True))
          assert result.get("deep_statistics_v2", {}).get("column_triage", {}).get("numeric_limit") == 12
          assert elapsed < 30
          PY
      - name: Verify NumPy Arrow profiling uses full-stream quantile sketches
        run: |
          python - <<'PY'
          import numpy as np
          import pyarrow as pa
          import framevitals.streaming_profile as streaming_profile
          from framevitals.sources import ArrowTableSource

          streaming_profile.resolve_numeric_backend = lambda: "numpy"
          rows = 100_000
          table = pa.table({
              "x": np.arange(rows, dtype=np.float64),
              "y": np.arange(rows, dtype=np.float64) * 2.0,
          })
          result = streaming_profile.build_streaming_profile(ArrowTableSource(table))
          assert result["streaming_metadata"]["numpy_full_stream_quantile_sketches"] is True
          assert result["numeric_summary_metadata"]["quantile_source"] == "full_stream_sketch"
          assert abs(result["numeric_summary"]["x"]["50%"] - 50_000) / 50_000 < 0.03
          print("NUMPY_STREAM_QUANTILES=PASS")
          PY
