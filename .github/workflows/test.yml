name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FrameVitals and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Verify package import
        run: |
          python -c "import framevitals; print(framevitals.__version__)"

      - name: Verify CLI
        run: |
          framevitals --version

      - name: Compile Python source
        run: |
          python -m compileall src/framevitals modules app.py streamlit_app.py

      - name: Run tests
        run: |
          pytest -v
