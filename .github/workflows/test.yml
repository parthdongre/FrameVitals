name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FrameVitals
        run: |
          pip install -e . --no-deps

      - name: Verify package import
        run: |
          python -c "import framevitals; print(framevitals.__version__)"

      - name: Verify CLI
        run: |
          framevitals --version

      - name: Compile Python source
        run: |
          python -m compileall modules src/framevitals app.py

      - name: Run tests
        run: |
          pytest -v
