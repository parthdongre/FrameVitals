site_name: FrameVitals
site_description: Diagnostics for structured data, graphs, tensors, ML models, data health, drift, and contracts.
repo_name: parthdongre/FrameVitals
repo_url: https://github.com/parthdongre/FrameVitals
edit_uri: edit/dev/docs/

strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Platform guide: platform.md
  - Engineering audit:
      - Baseline: audits/SOL_PLATFORM_BASELINE.md
      - Audit: audits/SOL_PLATFORM_AUDIT.md
      - Module map: audits/SOL_MODULE_MAP.md
      - Sol handoff: work-handoff/SOL_HANDOFF.md
      - Astra backlog: work-handoff/ASTRA_SCIENCE_BACKLOG.md
  - Scientific review:
      - Audit: audits/ASTRA_SCIENTIFIC_AUDIT.md
      - Mathematical methods: research/ASTRA_MATHEMATICAL_METHODS.md
      - Algorithm evaluation: research/ASTRA_ALGORITHM_EVALUATION.md
      - Performance report: benchmarks/ASTRA_PERFORMANCE_REPORT.md
  - Protocol architecture: protocols.md
  - Structured data and model diagnostics: structured-data.md
  - Terminal workspace: terminal-ui.md
  - Configuration: configuration.md
  - Planning: planning.md
  - Planner scheduling: planner-scheduling.md
  - Execution context: execution-context.md
  - Source-aware execution: source-execution.md
  - Execution provenance: execution-provenance.md
  - Result objects: result-objects.md
  - Quality gates and custom checks: quality-gates.md
  - Monitoring snapshots: monitoring.md
  - Extending FrameVitals: extending-framevitals.md
  - Stability and compatibility: stability.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
