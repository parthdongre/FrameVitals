[package]
name = "framevitals-py"
version = "0.1.0"
edition = "2021"
description = "PyO3 bridge for FrameVitals native kernels"
license = "MIT"
publish = false

[lib]
name = "_native"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
framevitals-core = { path = "../framevitals-core" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
